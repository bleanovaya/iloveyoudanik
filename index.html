<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my love</title>
  <link rel="stylesheet" href="./normalize.css">
  <style>
    body {
        margin: 0 auto;
        font-family: 'Courier New', Courier, monospace;
        font-weight: 600;
        font-size: 20px;
        background: #ffc8db;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
    }
    .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.star {
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgb(0, 0, 0);
    border-radius: 50%;
    opacity: 0.6;
    animation: floatStar linear infinite;
}

@keyframes floatStar {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    20% {
        opacity: 0.6;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
    .cat {
        font-size: 200px;
        cursor: pointer;
        transition: transform 0.2s;
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% {transform: scale(1.05); }
        100% {transform: scale(1); }
    }
    .cat:hover {
        transform: scale(1.1);
    }
    .message {
        margin-top: 30px;
        font-size: 40px;
        min-height: 30px;
        color: #d63384;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .message.show {
        opacity: 1;
        transform: translateY(0);
    }
    .heart {
        position: absolute;
        font-size: 20px;
        animation: floatUp 1s ease-out forwards;
        pointer-events: none;
    }
    @keyframes floatUp {
        0% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        100% {
            opacity: 0;
            transform: translateY(-100px) scale(1.5);
        }
    }
    .counter {
        margin-top: 40px;
        font-size: 18px;
        color: #000000;
        background-color: #ffc8db;
    }
    .signature {
        position: fixed;
        bottom: 15px;
        font-size: 14px;
        opacity: 0.6;
        color: #555;
    }
    .container {
        background-color: #ffe9fa;
        padding: 20px;
        border-radius: 5%;
        border: 2px #d63384 solid;
        margin-top: 20px;
    }
  </style>
</head>
<body>
    <div class="stars"></div>
    <div class="cat">🦊</div>
    <div>Даник, нажми на меня<br> можно несколько раз:3</div>
    <div class="container">
    <div class="message" id="message"></div>
    <div class="counter" id="counter"></div>
    </div>
    <script>
        const messages = [
            "Ты мой любимый лисёнок",
            "Я безумно люблю твою улыбку",
            "Я нашла в тебе родное",
            "Когда я смотрю на тебя, мне кажется это навечно",
            "Твои касания самые нежные и тёплые",
            "Твои шутки - мои любимые",
            "Ты моё самый сладкий секрет",
            "Ты делаешь мои дни светлее",
            "Рядом с тобой мне так тепло",
            "Спасибо, что ты у меня есть",
            "Даняяяя, я люблю тебя",
            "Рядом со мной ты - самый нежный, сильный и красивый мужчина"
        ];
        const cat = document.querySelector(".cat");
        const messageBlock = document.getElementById("message");
        
        let lastIndex = -1;
        let typingInterval = null;
        let isTyping = false;
        
        cat.addEventListener("click", function() {
            if (isTyping) return;
            let random;
            do {
                random = Math.floor(Math.random() * messages.length);
            } while (random === lastIndex);
            lastIndex = random;
            createHearts();
            typeText(messages[random]);
        });


        function createHearts() {
    for (let i = 0; i < 6; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💗";

        const rect = cat.getBoundingClientRect();

        heart.style.left = rect.left + rect.width / 2 + "px";
        heart.style.top = rect.top + rect.height / 2 + "px";

        heart.style.position = "fixed";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 1000);
    }
}

function typeText(text) {
    if (typingInterval) {
        clearInterval(typingInterval);
    }

    messageBlock.textContent = "";
    messageBlock.classList.add("show");

    let index = 0;
    isTyping = true;

    typingInterval = setInterval(() => {
        messageBlock.textContent += text[index];
        index++;

        if (index >= text.length) {
            clearInterval(typingInterval);
            typingInterval = null;
            isTyping = false;
        }
    }, 40);
}
        const startDate = new Date("2026-02-17");
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            document.getElementById("counter").textContent =
            "Мы вместе уже: " + days + " дней " + hours + " ч " + minutes + " мин 🖤";
        }
        setInterval(updateCounter, 60000);
        updateCounter();
        const starsContainer = document.querySelector(".stars");

function createStars() {
    for (let i = 0; i < 25; i++) {
        const star = document.createElement("div");
        star.className = "star";

        star.style.left = Math.random() * 100 + "vw";
        star.style.animationDuration = (5 + Math.random() * 5) + "s";
        star.style.animationDelay = Math.random() * 5 + "s";

        starsContainer.appendChild(star);
    }
}

createStars();
    </script>
    <div class="signature">
        для любимого Дани, чтобы улыбнулся!
    </div>
</body>
</html>
